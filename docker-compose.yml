version: '3.8'

services:
  mock-api:
    build: .
    entrypoint: ["uvicorn", "target_lab.mock_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  bmo-scanner:
    build: .
    depends_on:
      - mock-api
    volumes:
      - ./reports:/app/reports
    entrypoint: ["sh", "-c", "sleep 2 && python bmo_detector.py --target http://mock-api:8000/v1/chat --recon"]
