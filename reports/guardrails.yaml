BMODetector_guardrails:
  version: '2.0'
  generated_at: '2026-11-03 16:24:26'
  compliance_frameworks:
  - OWASP LLM Top 10 (2025)
  - MITRE ATLAS
  - EU AI Act Art. 15
  total_vulnerabilities_mitigated: 10
  active_policies:
  - rule_id: RULE-LLM01
    owasp_category: LLM01 - Prompt Injection & Jailbreak
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Isoler les instructions système avec des délimiteurs stricts
      et bloquer les changements de rôle.
  - rule_id: RULE-LLM02
    owasp_category: LLM02 - Sensitive Information Disclosure (PII)
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Appliquer un filtre d'anonymisation PII (masquage des emails
      et secrets) avant l'envoi de la réponse.
  - rule_id: RULE-LLM03
    owasp_category: LLM03 - Supply Chain Vulnerabilities
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Masquer la nomenclature technique (SBOM) et n'autoriser que
      des modèles signés (Safetensors).
  - rule_id: RULE-LLM04
    owasp_category: LLM04 - Data and Model Poisoning
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Nettoyer et auditer les datasets de fine-tuning contre les
      déclencheurs d'empoisonnement.
  - rule_id: RULE-LLM05
    owasp_category: LLM05 - Improper Output Handling
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Encoder systématiquement les sorties HTML/JS et utiliser
      des requêtes SQL paramétrées.
  - rule_id: RULE-LLM06
    owasp_category: LLM06 - Excessive Agency (Abus d'Outils)
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Appliquer le moindre privilège aux plugins de l'IA et imposer
      une confirmation humaine (HITL).
  - rule_id: RULE-LLM07
    owasp_category: LLM07 - System Prompt Leakage
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Séparer le prompt système de la topologie réseau et bloquer
      toute auto-référence aux consignes.
  - rule_id: RULE-LLM08
    owasp_category: LLM08 - Vector & Embedding Weaknesses (RAG)
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Implémenter un contrôle d'accès par rôle (RBAC) sur chaque
      document de la base vectorielle RAG.
  - rule_id: RULE-LLM09
    owasp_category: LLM09 - Misinformation & Hallucination
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Ancrer les réponses sur une base documentaire vérifiée (Grounded
      RAG) avec score de confiance.
  - rule_id: RULE-LLM10
    owasp_category: LLM10 - Unbounded Consumption (DoS)
    priority: P1-URGENT
    enforcement_action: BLOCK_AND_REDACT
    remediation_control: Définir une limite stricte max_tokens et activer le Rate-Limiting
      (HTTP 429) sur la passerelle API.
