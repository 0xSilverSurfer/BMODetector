[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "BMODetector"
version = "2.1.0"
description = "Offensive LLM & RAG API Security Scanner (OWASP LLM Top 10, MITRE ATLAS & EU AI Act)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.15.4",
    "click>=8.1.8",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0.2",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# Cible de laboratoire volontairement vulnérable (target_lab/mock_api.py)
lab = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["fastapi>=0.110", "uvicorn>=0.29", "pytest>=8", "jsonschema>=4", "ruff>=0.5"]

[project.scripts]
BMODetector = "bmo_detector:app"

[tool.setuptools]
py-modules = ["bmo_detector", "judge", "reporter", "scoring"]
packages = ["payloads", "target_lab"]

[tool.setuptools.package-data]
payloads = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E9", "F"]
