[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bmo-detector"
version = "2.0.0"
description = "Scanner Offensif & DevSecOps OWASP LLM Top 10 / MITRE ATLAS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer==0.12.3",
    "click==8.1.8",
    "rich==13.7.1",
    "httpx==0.27.0",
    "pyyaml==6.0.1",
    "reportlab==4.2.0",
    "fastapi==0.111.0",
    "uvicorn==0.30.1"
]

[project.scripts]
BMODetector = "bmo_detector:app"

[tool.setuptools]
py-modules = ["bmo_detector", "judge", "reporter"]
